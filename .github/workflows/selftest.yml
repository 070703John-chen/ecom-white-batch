name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (Linux headless)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.21,<3" "pillow>=9.0,<13" "opencv-python-headless>=4.5,<5"

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r ecom-white-batch/requirements.txt

      - name: Run selftest
        run: python ecom-white-batch/scripts/selftest.py
